# =============================================================================
# Trading Journal — Core Configuration
# =============================================================================

# ---------------------------------------------------------------------------
# Backend (FastAPI)
# ---------------------------------------------------------------------------
backend:
  host: "0.0.0.0"
  port: 8000
  database_url: "sqlite:///./trading_journal.db"
  cors_origins: "http://localhost:5173,http://localhost:3000,http://localhost:8000"
  reload: true

# ---------------------------------------------------------------------------
# Frontend (React / Vite dev server)
# ---------------------------------------------------------------------------
frontend:
  enabled: true
  dev_port: 5173

# ---------------------------------------------------------------------------
# Screenshot Capture
# ---------------------------------------------------------------------------
screenshots:
  enabled: true
  engine: "mss"
  capture_hotkey: "ctrl+shift+s"
  region_hotkey: "ctrl+shift+r"
  auto_capture: true
  save_dir: "screenshots"
  format: "png"
  quality: 95

# ---------------------------------------------------------------------------
# Database
# ---------------------------------------------------------------------------
database:
  primary: "sqlite"
  export:
    csv_dir: "exports/csv"

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging:
  level: "INFO"
  file: "journal.log"
  max_size_mb: 10
  backup_count: 3
